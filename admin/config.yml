backend:
  name: git-gateway
  branch: main

media_folder: "photos"
public_folder: "photos"

locale: "ko"

collections:
  - name: "photos"
    label: "사진 바꾸기"
    description: "바꾸고 싶은 묶음을 눌러 사진을 교체하고, 오른쪽 위 '게시'를 누르세요. 1~2분 뒤 홈페이지에 반영됩니다."
    editor:
      preview: false
    files:
      - name: "menu"
        label: "🍚 이달의 식단표"
        file: "admin/data/photos.json"
        fields:
          - { name: "menu", label: "식단표", widget: "image" }
          - { name: "main1", label: "슬라이드 1", widget: "image" }
          - { name: "main2", label: "슬라이드 2", widget: "image" }
          - { name: "main3", label: "슬라이드 3", widget: "image" }
          - { name: "main4", label: "슬라이드 4", widget: "image" }
          - { name: "intro1", label: "소개-보육실", widget: "image" }
          - { name: "intro2", label: "소개-바깥놀이", widget: "image" }
          - { name: "intro3", label: "소개-급식", widget: "image" }
          - { name: "gallery1", label: "갤러리 1", widget: "image" }
          - { name: "gallery2", label: "갤러리 2", widget: "image" }
          - { name: "gallery3", label: "갤러리 3", widget: "image" }
          - { name: "gallery4", label: "갤러리 4", widget: "image" }
          - { name: "gallery5", label: "갤러리 5", widget: "image" }
          - { name: "gallery6", label: "갤러리 6", widget: "image" }
          - { name: "gallery7", label: "갤러리 7", widget: "image" }
          - { name: "gallery8", label: "갤러리 8", widget: "image" }
          - { name: "gallery9", label: "갤러리 9", widget: "image" }
          - { name: "gallery10", label: "갤러리 10", widget: "image" }

  - name: "texts"
    label: "글 바꾸기"
    description: "고치고 싶은 묶음을 눌러 글을 수정하고, 오른쪽 위 '게시'를 누르세요. 1~2분 뒤 홈페이지에 반영됩니다. 글자를 굵게 하고 싶으면 **굵게 할 말** 처럼 별표 두 개로 감싸 주세요."
    editor:
      preview: false
    files:
      - name: "site_texts"
        label: "✍️ 홈페이지 글"
        file: "admin/data/texts.json"
        fields:
          # ── 매달 바뀌는 내용 ──
          - name: "events_title"
            label: "📅 이달의 행사 — 제목"
            widget: "string"
            hint: "예) 🗓️ 9월 행사 일정 — 열매달"
          - name: "events_intro"
            label: "📅 이달의 행사 — 인사말"
            widget: "text"
          - name: "events"
            label: "📅 이달의 행사 — 일정 목록"
            label_singular: "행사"
            widget: "list"
            collapsed: false
            hint: "＋를 눌러 행사를 추가하고, 왼쪽 손잡이를 끌어 순서를 바꿀 수 있어요."
            fields:
              - { name: "date", label: "날짜", widget: "string", hint: "예) 9/13" }
              - { name: "day", label: "요일", widget: "string", required: false, hint: "예) 목" }
              - { name: "title", label: "행사 이름", widget: "string" }
              - { name: "target", label: "대상 · 반", widget: "string", required: false }
              - { name: "note", label: "준비물 · 비고", widget: "string", required: false }
          - name: "notices_title"
            label: "📢 안내와 협조 — 제목"
            widget: "string"
          - name: "notices"
            label: "📢 안내와 협조 — 목록"
            label_singular: "안내"
            widget: "list"
            collapsed: false
            fields:
              - { name: "tag", label: "구분", widget: "string", hint: "예) 협조 · 건강 · 휴원 · 문의" }
              - { name: "text", label: "내용", widget: "text" }

          # ── 가끔 바뀌는 내용 ──
          - name: "hero_name"
            label: "🏠 메인 — 어린이집 이름"
            widget: "string"
          - name: "hero_title"
            label: "🏠 메인 — 큰 문구"
            widget: "text"
            hint: "줄을 바꾸면 홈페이지에서도 그대로 줄이 바뀝니다."
          - name: "hero_sub"
            label: "🏠 메인 — 아래 설명"
            widget: "text"
          - name: "greet_title"
            label: "👩‍🏫 원장 인사말 — 제목"
            widget: "string"
          - name: "greet_body"
            label: "👩‍🏫 원장 인사말 — 본문"
            widget: "text"
            hint: "문단을 나누려면 빈 줄 하나를 넣어 주세요."
          - name: "greet_sign"
            label: "👩‍🏫 원장 인사말 — 서명"
            widget: "string"

          - name: "intro1_t"
            label: "🏫 소개 1 — 제목"
            widget: "string"
          - name: "intro1_d"
            label: "🏫 소개 1 — 설명"
            widget: "text"
          - name: "intro2_t"
            label: "🏫 소개 2 — 제목"
            widget: "string"
          - name: "intro2_d"
            label: "🏫 소개 2 — 설명"
            widget: "text"
          - name: "intro3_t"
            label: "🏫 소개 3 — 제목"
            widget: "string"
          - name: "intro3_d"
            label: "🏫 소개 3 — 설명"
            widget: "text"

          - name: "sp1_e"
            label: "⭐ 특별함 1 — 그림문자"
            widget: "string"
          - name: "sp1_t"
            label: "⭐ 특별함 1 — 제목"
            widget: "string"
          - name: "sp1_d"
            label: "⭐ 특별함 1 — 설명"
            widget: "text"
          - name: "sp2_e"
            label: "⭐ 특별함 2 — 그림문자"
            widget: "string"
          - name: "sp2_t"
            label: "⭐ 특별함 2 — 제목"
            widget: "string"
          - name: "sp2_d"
            label: "⭐ 특별함 2 — 설명"
            widget: "text"
          - name: "sp3_e"
            label: "⭐ 특별함 3 — 그림문자"
            widget: "string"
          - name: "sp3_t"
            label: "⭐ 특별함 3 — 제목"
            widget: "string"
          - name: "sp3_d"
            label: "⭐ 특별함 3 — 설명"
            widget: "text"
          - name: "sp4_e"
            label: "⭐ 특별함 4 — 그림문자"
            widget: "string"
          - name: "sp4_t"
            label: "⭐ 특별함 4 — 제목"
            widget: "string"
          - name: "sp4_d"
            label: "⭐ 특별함 4 — 설명"
            widget: "text"
          - name: "sp5_e"
            label: "⭐ 특별함 5 — 그림문자"
            widget: "string"
          - name: "sp5_t"
            label: "⭐ 특별함 5 — 제목"
            widget: "string"
          - name: "sp5_d"
            label: "⭐ 특별함 5 — 설명"
            widget: "text"
          - name: "sp6_e"
            label: "⭐ 특별함 6 — 그림문자"
            widget: "string"
          - name: "sp6_t"
            label: "⭐ 특별함 6 — 제목"
            widget: "string"
          - name: "sp6_d"
            label: "⭐ 특별함 6 — 설명"
            widget: "text"

          - name: "eco_lead"
            label: "🌱 생태전환교육 — 소개글"
            widget: "text"
          - name: "eco1_t"
            label: "🌱 생태 카드 1 — 제목"
            widget: "string"
          - name: "eco1_d"
            label: "🌱 생태 카드 1 — 설명"
            widget: "text"
          - name: "eco2_t"
            label: "🌱 생태 카드 2 — 제목"
            widget: "string"
          - name: "eco2_d"
            label: "🌱 생태 카드 2 — 설명"
            widget: "text"
          - name: "eco3_t"
            label: "🌱 생태 카드 3 — 제목"
            widget: "string"
          - name: "eco3_d"
            label: "🌱 생태 카드 3 — 설명"
            widget: "text"

          - name: "day"
            label: "🕰️ 하루일과"
            label_singular: "시간대"
            widget: "list"
            collapsed: true
            fields:
              - { name: "time", label: "시간", widget: "string", hint: "예) 09:00 – 10:50" }
              - { name: "title", label: "활동", widget: "string" }
              - { name: "note", label: "덧붙임", widget: "string", required: false }
          - name: "day_note"
            label: "🕰️ 하루일과 — 아래 안내문"
            widget: "text"

          - name: "faq1_q"
            label: "❓ 질문 1"
            widget: "string"
          - name: "faq1_a"
            label: "❓ 답변 1"
            widget: "text"
          - name: "faq2_q"
            label: "❓ 질문 2"
            widget: "string"
          - name: "faq2_a"
            label: "❓ 답변 2"
            widget: "text"
          - name: "faq3_q"
            label: "❓ 질문 3"
            widget: "string"
          - name: "faq3_a"
            label: "❓ 답변 3"
            widget: "text"
          - name: "faq4_q"
            label: "❓ 질문 4"
            widget: "string"
          - name: "faq4_a"
            label: "❓ 답변 4"
            widget: "text"
          - name: "menu_text"
            label: "🍚 오늘의 식단 (한 달치)"
            widget: "text"
            hint: "한 줄에 하루씩 적어 주세요. 날짜 | 오전 간식 | 점심 | 오후 간식 순서이고, 특별식단은 날짜 뒤에 [튼튼싹싹식단] 처럼 대괄호로 적으면 홈페이지에 딱지가 붙습니다."
